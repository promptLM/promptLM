[project]
name = "{{PROJECT_NAME}}"
# `version` is a fallback used when neither a GitHub Release tag nor a manual
# workflow_dispatch version is supplied. The bundle-release workflow injects
# the real publish version via $BUNDLE_VERSION at release time.
version = "1.0.0"
# 0.1.0 ships a single target: java → GitHub Packages. Python and JS targets
# are deferred; see docs/release-classes.md in the promptLM app for scope.
targets = ["java"]

[artifacts.java]
group_id = "{{MAVEN_GROUP_ID}}"
artifact_id = "{{MAVEN_ARTIFACT_ID}}"
packaging = "jar"

[artifacts.python]
distribution_name = "{{PYTHON_DISTRIBUTION_NAME}}"
import_name = "{{PYTHON_IMPORT_NAME}}"
build_types = ["wheel", "sdist"]

[artifacts.js]
package_name = "{{NPM_PACKAGE_NAME}}"
module_type = "commonjs"

[deploy]
# 0.1.0: bundle-release publishes to GitHub Packages via the `github` profile.
# Flip `enabled` to false to skip publishing (build-only).
enabled = true
profile = "github"

[deploy.profiles.github]
type = "github_packages"
# The workflow overrides this via $BUNDLE_RELEASE_MAVEN_URL so the same
# template serves both real-GitHub repos (default) and the local acceptance
# tests (Artifactory testcontainer playing as a Maven registry).
maven_repo_url = "https://maven.pkg.github.com/{{REPO_OWNER}}/{{REPO_NAME}}"
# `maven_repo_id` matches the `<server id=...>` in the settings.xml that
# bundle-release.yml writes from $BUNDLE_RELEASE_USERNAME/$BUNDLE_RELEASE_PASSWORD
# (defaults: GITHUB_ACTOR + GITHUB_TOKEN).
maven_repo_id = "github"
# GitHub Packages does not provide a generic PyPI endpoint. Teams that need
# PyPI publishing typically point this at a self-hosted index or PyPI itself;
# leave the placeholder so the misconfiguration is loud rather than silent.
pypi_repo_url = "https://REPLACE_ME_pypi_repo_url"
npm_repo_url = "https://npm.pkg.github.com"

# --- Opt-in profiles (not used in 0.1.0; select via `[deploy].profile`) ----

[deploy.profiles.artifactory]
type = "artifactory"
maven_repo_url = "https://REPLACE_ME_ARTIFACTORY_URL/libs-release-local"
pypi_repo_url = "https://REPLACE_ME_ARTIFACTORY_URL/api/pypi/pypi-local"
npm_repo_url = "https://REPLACE_ME_ARTIFACTORY_URL/api/npm/npm-local"

[deploy.profiles.custom]
type = "custom"
maven_repo_url = "https://REPLACE_ME_custom_maven_url"
pypi_repo_url = "https://REPLACE_ME_custom_pypi_url"
npm_repo_url = "https://REPLACE_ME_custom_npm_url"
