name: Release

# Thin caller of the org-wide reusable workflow at
# promptLM/.github/.github/workflows/release-java-ghpackages.yml.
#
# The reusable owns the full pipeline (validate → verify → native matrix →
# native-smoke → deploy to GH Packages → create GH Release with binaries).
# This file only:
#   1. computes the next version from the release_type (major/minor/patch)
#   2. delegates to the reusable with that version
#
# When the repo moves to release-please, replace the calculate_version job
# with a release-please job that emits the version on tag creation, and the
# call below stays identical.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release (major, minor, patch)'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
      dry-run:
        description: 'Run the pipeline without deploying or creating the release'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # for the GH Release the reusable creates
  packages: write   # for the GH Packages publish the reusable performs

jobs:
  calculate_version:
    name: compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Bump version
        id: set-version
        run: |
          set -euo pipefail
          # Parse pom.xml directly: `mvn help:evaluate` fails here because the
          # parent POM (../promptlm-platform/pom.xml) is in a sibling repo not
          # checked out on the runner, and `-q` swallows the resolution error.
          # Take the first <version> AFTER </parent> — that's the project's own.
          current_version=$(awk '
            /<\/parent>/ { past_parent = 1; next }
            past_parent && /<version>/ {
              sub(/.*<version>/, ""); sub(/<\/version>.*/, "")
              gsub(/^[ \t]+|[ \t]+$/, "")
              print; exit
            }
          ' pom.xml)
          if [[ -z "$current_version" ]]; then
            echo "Could not locate <version> in pom.xml" >&2; exit 1
          fi
          base_version="${current_version%-SNAPSHOT}"
          IFS='.' read -r major minor patch <<< "$base_version"
          if [[ -z "${major:-}" || -z "${minor:-}" || -z "${patch:-}" ]]; then
            echo "Unsupported project.version: $current_version" >&2; exit 1
          fi
          if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
            echo "Expected semantic version with optional -SNAPSHOT, got: $current_version" >&2; exit 1
          fi
          # SNAPSHOT semantics (Maven convention): pom.xml "X.Y.Z-SNAPSHOT" already
          # represents the next release as X.Y.Z, so `patch` releases X.Y.Z unchanged.
          # `minor` / `major` still skip ahead regardless. On a non-SNAPSHOT pom (rare —
          # only when releasing immediately on top of an already-published version
          # without manually bumping), `patch` bumps the patch component.
          case "${{ inputs.release_type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch)
              [[ "$current_version" == *-SNAPSHOT ]] || patch=$((patch + 1))
              ;;
            *) echo "Unsupported release_type: ${{ inputs.release_type }}" >&2; exit 1 ;;
          esac
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

  publish:
    name: publish v${{ needs.calculate_version.outputs.version }}
    needs: calculate_version
    uses: promptLM/.github/.github/workflows/release-java-ghpackages.yml@main
    with:
      version: ${{ needs.calculate_version.outputs.version }}
      dry-run: ${{ inputs.dry-run }}
      maven-package-name: dev.promptlm.promptlm-parent
      cli-binary: promptlm-cli
      # GraalVM CE 25.0.2 publishes only 4 OS/arch binaries:
      #   linux-x64, linux-aarch64, macos-aarch64, windows-x64.
      # The default 6-target matrix in the reusable workflow assumes
      # binaries that don't exist for this GraalVM version, so the
      # `windows-aarch64` (#346) and `macos-x64` (#350) legs fail at
      # `Set up GraalVM` with a download 404. Scope to the 4 targets
      # CE actually ships for 0.1.0; restore the missing legs in 0.2.0
      # once upstream ships or we switch GraalVM distributions.
      native-targets: |
        [
          {"os": "ubuntu-latest",    "platform": "linux",   "arch": "x64"},
          {"os": "ubuntu-24.04-arm", "platform": "linux",   "arch": "arm64"},
          {"os": "macos-14",         "platform": "macos",   "arch": "arm64"},
          {"os": "windows-latest",   "platform": "windows", "arch": "x64"}
        ]
    secrets: inherit
