name: Acceptance Tests

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Test profile: smoke (fast) or full (includes native-acceptance)'
        type: choice
        required: false
        default: smoke
        options:
          - smoke
          - full
  schedule:
    # Nightly full run against the default branch at 03:00 UTC.
    # Schedule trigger always runs the `full` profile.
    - cron: '0 3 * * *'
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decide:
    name: Decide whether to run acceptance
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
      profile: ${{ steps.decide.outputs.profile }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590  # v3
        with:
          filters: |
            critical:
              - 'pom.xml'
              - '**/pom.xml'
              - 'acceptance-tests/**'
              - 'components/repository-template/**'
              # Frontend sources are baked into the webapp bundle that the
              # acceptance suite drives via Playwright. Any change here can
              # alter UI behavior end-to-end and must trigger the suite.
              - 'components/promptlm-web-ui/**'
              - 'components/ui/**'
              - '.github/workflows/acceptance.yml'
              - '.github/workflows/CI.yml'

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-acceptance') }}
          PATHS_MATCH: ${{ steps.filter.outputs.critical }}
          DISPATCH_PROFILE: ${{ github.event.inputs.profile }}
        run: |
          run=false
          reason=""
          # Profile decision runs in parallel with the run decision:
          #   full  -> nightly schedule, PR carrying the `run-acceptance`
          #            label, or workflow_dispatch with profile=full
          #   smoke -> everything else (default for manual dispatch and
          #            unlabeled critical-path PRs)
          profile=smoke
          case "$EVENT" in
            workflow_dispatch)
              run=true; reason="manual dispatch"
              if [[ "$DISPATCH_PROFILE" == "full" ]]; then
                profile=full
              fi
              ;;
            schedule)
              # Nightly always runs, always full — no PR context to gate on.
              run=true; reason="nightly schedule"
              profile=full
              ;;
            pull_request)
              if [[ "$ACTION" == "labeled" ]]; then
                if [[ "$LABEL_NAME" == "run-acceptance" ]]; then
                  run=true; reason="run-acceptance label added"
                  profile=full
                else
                  reason="unrelated label '$LABEL_NAME' — skipping"
                fi
              else
                if [[ "$HAS_LABEL" == "true" ]]; then
                  run=true; reason="run-acceptance label present"
                  profile=full
                elif [[ "$PATHS_MATCH" == "true" ]]; then
                  run=true; reason="critical paths changed"
                  # smoke profile by default for unlabeled critical-path PRs
                else
                  reason="no critical paths and no label — skipping"
                fi
              fi
              ;;
            *)
              reason="unsupported event '$EVENT'"
              ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "::notice title=Acceptance gate::run=$run profile=$profile ($reason)"

  # Provision a Hetzner Cloud VM and register it as a self-hosted runner.
  # Three-job pattern (provision → acceptance → teardown) lifted from
  # promptLM/.github docs/hetzner-runners.md. We call Cyclenerd's action
  # directly rather than promptLM/.github's hetzner-runner.yml reusable
  # workflow because the existing acceptance job uses setup-java caching,
  # a local composite action (install-platform-parent), and an upload-
  # artifact step on failure — none of which fit the single-shell-command
  # interface of hetzner-runner.yml.
  provision-runner:
    name: Provision Hetzner runner
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      label: ${{ steps.runner.outputs.label }}
      server_id: ${{ steps.runner.outputs.server_id }}
    steps:
      - id: runner
        uses: Cyclenerd/hcloud-github-runner@2904b0bc60c7b3b19331bd4d48dc87c58ad2d04f  # v1 (v1.4.0)
        with:
          mode: create
          github_token: ${{ secrets.RUNNER_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          # cx33 (AMD EPYC, current gen) — what the snapshot bake uses.
          # An earlier 412 ("Resource limitation detected", run 27355655316)
          # appears to have been transient stock-out, not a persistent issue:
          # the bake successfully uses cx33/fsn1 daily. A subsequent try with
          # cx42 (run 27360766749) hit 422 because the cx42 name still
          # resolves to the deprecated Intel SKU (type 106) — promptLM/.github's
          # docs/hetzner-runners.md whitelist needs an update.
          server_type: cx33
          location: fsn1
          image: ${{ vars.HETZNER_RUNNER_SNAPSHOT_ID || 'ubuntu-24.04' }}
          # Fallback baseline install if the snapshot var isn't set yet.
          # The snapshot bake removes this branch in steady state.
          pre_runner_script: |
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y \
                openjdk-17-jdk-headless openjdk-21-jdk-headless \
                maven git curl wget jq unzip make ca-certificates
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y nodejs
              npm install -g pnpm yarn
            fi

  acceptance:
    name: Acceptance Tests
    needs: [decide, provision-runner]
    if: needs.decide.outputs.run == 'true'
    runs-on: ${{ needs.provision-runner.outputs.label }}
    # Bumped from 60 to accommodate the cold native-image build on the
    # fallback (non-snapshot) image. Drop back to 60 once
    # promptLM/.github#36 bakes GraalVM + Playwright browsers into the
    # snapshot.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REPO_REMOTE_URL: ${{ secrets.REPO_REMOTE_URL }}
      REPO_REMOTE_USERNAME: ${{ secrets.REPO_REMOTE_USERNAME }}
      REPO_REMOTE_TOKEN: ${{ secrets.REPO_REMOTE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Install promptlm-platform parent POM
        uses: ./.github/actions/install-platform-parent

      - name: Build promptLM Framework
        run: mvn -B -DskipTests install

      # Swap JAVA_HOME to GraalVM CE 21 before the native build. The
      # native-maven-plugin requires GRAALVM_HOME or JAVA_HOME to point at
      # a GraalVM distribution; setup-java with distribution=graalvm sets
      # both. GraalVM CE 21 is a fully-compatible JDK, so the subsequent
      # acceptance-tests step keeps working under it.
      # When promptLM/.github#36 lands a snapshot with native-image
      # pre-installed, this step can be removed (the snapshot will already
      # have GraalVM on PATH).
      - name: Set up GraalVM 21 for native-image
        if: needs.decide.outputs.profile == 'full'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: 'maven'

      # Native binaries are only needed for the `native-acceptance` group,
      # which runs in the `full` profile. We build them on the same VM as
      # the tests so the binary SHA stays coherent with the source tree.
      - name: Build native binaries
        if: needs.decide.outputs.profile == 'full'
        run: >
          mvn -B -Pnative
          -pl apps/promptlm-cli,apps/promptlm-webapp -am
          -DskipTests package

      - name: Run acceptance tests (smoke profile)
        if: needs.decide.outputs.profile == 'smoke'
        run: >
          mvn -B -f acceptance-tests/pom.xml
          -Dpromptlm.bootstrap.skip=true
          -Dpromptlm.test.groups=integration,native-smoke
          -Dpromptlm.test.excludedGroups=
          test

      - name: Run acceptance tests (full profile)
        if: needs.decide.outputs.profile == 'full'
        env:
          # PLAYWRIGHT_BROWSERS_PATH: set this once promptLM/.github#36 lands a snapshot
          # with chromium pre-installed. Until then the in-pom playwright install step
          # handles it on the fly.
          CLI_NATIVE: ${{ github.workspace }}/apps/promptlm-cli/target/promptlm-cli
          WEBAPP_NATIVE: ${{ github.workspace }}/apps/promptlm-webapp/target/promptlm-webapp
        run: >
          mvn -B -f acceptance-tests/pom.xml
          -Dpromptlm.bootstrap.skip=true
          -Dpromptlm.test.groups=integration,native-smoke,native-acceptance
          -Dpromptlm.test.excludedGroups=
          -Dpromptlm.test.cli.native.path=$CLI_NATIVE
          -Dpromptlm.test.webapp.native.path=$WEBAPP_NATIVE
          -Dpromptlm.test.requireNativeBinaries=true
          test

      - name: Upload Acceptance Test Artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: acceptance-tests-${{ github.sha }}
          if-no-files-found: warn
          path: |
            acceptance-tests/target/surefire-reports/**
            acceptance-tests/target/screenshots/**
            acceptance-tests/target/traces/**
            acceptance-tests/target/diagnostics/**
            acceptance-tests/target/snapshots/**
          retention-days: 7

  teardown-runner:
    name: Teardown Hetzner runner
    needs: [provision-runner, acceptance]
    # Tear down whether acceptance passed, failed, or was cancelled — but
    # only if provision-runner produced a server_id. (If provision-runner
    # itself was skipped because `decide` said no, there's nothing to tear
    # down.)
    if: always() && needs.provision-runner.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # continue-on-error: Cyclenerd's delete mode does two things — delete
      # the Hetzner VM (cost-critical) and deregister the GitHub Actions
      # runner record (cosmetic). The VM-delete part is reliable; the
      # runner-deregister part fails when the runner has already
      # auto-removed itself on clean exit (ephemeral-runner behavior) —
      # the action then reports "Failed to get ID of the GitHub Actions
      # Runner!" and exits 1, marking the whole job red despite the VM
      # being gone.
      #
      # The cost-critical work is the VM delete. Offline runner records
      # are auto-cleaned by GitHub after ~14 days, and the orphan-sweep
      # workflow in promptLM/.github catches any VMs that survive anyway.
      # So failing the workflow on this is noise — swallow it.
      - uses: Cyclenerd/hcloud-github-runner@2904b0bc60c7b3b19331bd4d48dc87c58ad2d04f  # v1 (v1.4.0)
        continue-on-error: true
        with:
          mode: delete
          github_token: ${{ secrets.RUNNER_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_id: ${{ needs.provision-runner.outputs.server_id }}

      # Belt-and-braces VM cleanup: if Cyclenerd above somehow exited
      # before the hcloud delete call (vs. failing afterwards), this
      # catches it. The orphan-sweep workflow in promptLM/.github is a
      # third backstop after both of these.
      - name: Force-delete VM if still present
        if: always()
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          SERVER_ID: ${{ needs.provision-runner.outputs.server_id }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
            "https://api.hetzner.cloud/v1/servers/${SERVER_ID}")
          case "$status" in
            200)
              echo "Server ${SERVER_ID} still present — deleting"
              curl -sS -X DELETE \
                -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
                "https://api.hetzner.cloud/v1/servers/${SERVER_ID}" \
                | jq .
              ;;
            404)
              echo "Server ${SERVER_ID} already deleted — nothing to do"
              ;;
            *)
              echo "::warning::Unexpected status ${status} probing Hetzner API for server ${SERVER_ID}; orphan-sweep will catch it within 6h if it's still alive."
              ;;
          esac
